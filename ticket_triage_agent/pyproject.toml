[project]
name = "triage-agent"
version = "0.1.0"
description = "Multi-agent customer-support ticket triage agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.12",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-aws==1.7.1",
    "langchain-anthropic==1.7.5",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "langgraph-checkpoint-sqlite==3.1.1",
    "sqlite-vec==0.1.9",
    "streamlit==1.57.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that call a real LLM",
]
